# Publishes the website to GitHub Pages every time changes are pushed to the main branch.
# The site is plain HTML/CSS/JS in static/, so there is nothing to compile: the workflow
# checks that the JavaScript is valid and then uploads the static/ folder as the website.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If several pushes happen quickly, only the latest one gets deployed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the JavaScript is valid
        run: for f in static/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: static

      - id: deployment
        uses: actions/deploy-pages@v4
